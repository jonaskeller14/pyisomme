name: Lint and Test

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  # Lets python-publish.yml gate a release on these same checks instead of
  # duplicating them. Keep this trigger - removing it breaks the release.
  workflow_call:

permissions:
  contents: read

jobs:
  lint:
    name: Lint (ruff + mypy + import smoke test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # setuptools-scm derives the version from `git describe`, so the
          # default shallow, tagless clone would make `pip install -e .` fail.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      # mypy needs the real dependency signatures and the import smoke test needs
      # the package importable; both come from the dev extra (which pins ruff/mypy).
      - name: Install package with dev extras
        run: pip install -e ".[dev]"

      # Blocking since refactor step 3: the baseline is clean, keep it that way.
      - name: Run ruff
        run: ruff check .

      # Scoped to pyisomme/report/ by [tool.mypy] in pyproject.toml.
      - name: Run mypy
        run: mypy

      # The report tests that need no fixture data from data/: one imports every
      # module under pyisomme/report/ and checks the protocol subpackage re-exports,
      # one snapshots every report's criterion/limit/page definition, and one covers
      # the manual-input declarations, the setattr guard and the input round-trip.
      - name: Fixture-free report tests
        run: python -m unittest tests.test_report_modules tests.test_report_structure tests.test_manual_inputs

  test:
    name: Test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          # setuptools-scm derives the version from `git describe`, so the
          # default shallow, tagless clone would make `pip install -e .` fail.
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package with dev extras
        run: pip install -e ".[dev]"

      # Non-blocking for now: several tests rely on fixture data that is not
      # yet tracked in the repo. Flip continue-on-error off once that is fixed.
      - name: Run test suite
        continue-on-error: true
        run: python -m unittest discover -s tests
