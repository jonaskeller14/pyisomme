[build-system]
requires      = ["setuptools>=64.0.0", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "pyisomme"
# Derived from the git tag by setuptools-scm - see [tool.setuptools_scm] below.
# Do not add a static `version` here: the release workflow asserts that the built
# version equals the release tag, and a static value can only ever disagree.
dynamic = ["version"]
description = "Tools for ISO-MME file format (merge, report, calculate, CFC-filter, ...)"
readme = "README.md"
authors = [{ name = "Jonas Keller", email = "jonaskeller14@googlemail.com" }]
license = { file = "LICENSE" }
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
]
keywords = ["pyisomme", "isomme", "iso-mme", "iso"]
dependencies = [
    "matplotlib~=3.7.4",
    "astropy~=6.0.0",
    "pandas~=2.2.0",
    "tqdm~=4.66.1",
    "numpy~=1.26.3",
    "scipy~=1.12.0",
    "python-pptx~=0.6.23",
    "dtwalign~=0.1.1",
    "requests>=2.32.5",
    "objective-rating-metrics~=1.3",
]
requires-python = ">=3.9"

[dependency-groups]
dev = [
    "mypy>=1.19.1",
    "nox>=2026.4.10",
    "ruff>=0.16.1",
]

notebook = [
    "ipykernel>=6",
    "ipywidgets>=8",
]

[project.urls]
Homepage = "https://github.com/jonaskeller14/pyisomme"

[project.scripts]
pyisomme = "pyisomme.__main__:main"

# The released version is `git describe` on the checked-out commit: tag `v0.0.5`
# becomes version `0.0.5` (the leading `v` is stripped by the default tag_regex).
# A build with no git metadata - a source zip, not a clone - falls back to 0.0.0
# rather than erroring; the release workflow's tag check turns that into a hard
# failure where it matters.
[tool.setuptools_scm]
version_file = "pyisomme/_version.py"
fallback_version = "0.0.0"

# NOTE: inert since MANIFEST.in started pruning docs/ and references/ from the
# sdist (the wheel is built from the sdist, so these globs now match nothing).
# That is deliberate: it dropped the release from 4.7 MB to 139 kB, and
# data-files installed the notebooks and a 4.5 MB PDF into <sys.prefix>/docs of
# every user's environment. Delete the MANIFEST.in prune lines to restore it.
[tool.setuptools.data-files]
"docs" = [
    "docs/*.ipynb",
    "docs/*.md",
]

[tool.setuptools.packages.find]
include = ["pyisomme*"]

[tool.setuptools.package-data]
"pyisomme" = ["channel_codes.xml"]

# --------------------------------------------------------------------------
# Static checking
#
# mypy is deliberately scoped to pyisomme/report/ for now (refactor step 3):
# that is where the criterion trees and the ~530 unchecked attribute chains
# live. The core modules are still *analysed* (report/ needs their signatures)
# but their own errors are silenced via follow_imports. Widen `files` and drop
# the override once the core is annotated too.
# --------------------------------------------------------------------------
[tool.mypy]
python_version = "3.9"
files = ["pyisomme"]
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
disallow_incomplete_defs = true

[[tool.mypy.overrides]]
module = [
    "pyisomme",
    "pyisomme.__main__",
    "pyisomme.calculate",
    "pyisomme.calculate.*",
    "pyisomme.channel",
    "pyisomme.code",
    "pyisomme.correlation",
    "pyisomme.errors",
    "pyisomme.info",
    "pyisomme.isomme",
    "pyisomme.limit",
    "pyisomme.limits",
    "pyisomme.parsing",
    "pyisomme.plotting",
    "pyisomme.plotting.*",
    "pyisomme.providers",
    "pyisomme.sources",
    "pyisomme.unit",
    "pyisomme.utils",
]
follow_imports = "silent"
disallow_untyped_defs = false
disallow_incomplete_defs = false

[tool.ruff]
target-version = "py39"
extend-exclude = [".venv", "out", "data", "docs", "head-trajectory-calculation"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP"]
ignore = [
    "E501",    # line length: channel-pattern expressions are deliberately one-liners here
    "E741",    # ambiguous variable name (l/I/O) - used for physical symbols
    "B008",    # function call in default argument
]

[tool.ruff.lint.per-file-ignores]
# Re-export modules: names are imported for their side effect of being bound.
"pyisomme/__init__.py" = ["F401", "F403"]
"pyisomme/report/__init__.py" = ["F401"]
"pyisomme/report/*/__init__.py" = ["F401"]
